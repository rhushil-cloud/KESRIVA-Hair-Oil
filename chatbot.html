<div id="kesriva-chatbot" class="fixed bottom-5 right-5 z-50 font-sans">
  
  <button 
    id="chat-toggle-btn" 
    onclick="toggleChatbot()" 
    class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-[#0b2219] border-2 border-amber-400/80 text-amber-300 text-xs font-bold shadow-2xl hover:bg-[#0f291e] transition">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span>KESRIVA AI Help</span>
  </button>

  <div 
    id="chat-window" 
    class="hidden fixed bottom-5 right-5 w-[90vw] sm:w-[350px] h-[480px] bg-[#0b2219] border-2 border-amber-400/70 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
    
    <div class="bg-[#0f291e] p-3 border-b border-emerald-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-amber-400 text-emerald-950 font-serif font-bold flex items-center justify-center text-xs">K</div>
        <span class="font-serif font-bold text-amber-300 text-xs">KESRIVA Scalp Advisor</span>
      </div>
      <button onclick="toggleChatbot()" class="text-emerald-200 hover:text-amber-300 font-bold">&times;</button>
    </div>

    <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 bg-[#081a13] text-[11px]">
      <div class="bg-[#0f291e] border border-emerald-700/50 text-emerald-100 p-2.5 rounded-xl max-w-[85%]">
        Hello! 👋 Welcome to KESRIVA Hair Care. How can I assist your hair health today?
      </div>
    </div>

    <div class="p-2.5 bg-[#0f291e] border-t border-emerald-800">
      <form onsubmit="handleUserSubmit(event)" class="flex gap-1.5">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask about ingredients, usage, price..." 
          class="flex-1 bg-[#081a13] border border-emerald-700/60 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400"
          required
        />
        <button type="submit" class="px-3 py-1.5 rounded-lg bg-amber-400 text-emerald-950 font-bold text-xs">
          Send
        </button>
      </form>
    </div>

  </div>
</div>

<script>
  function toggleChatbot() {
    document.getElementById('chat-window').classList.toggle('hidden');
  }

  function handleUserSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const val = input.value.trim();
    if (!val) return;

    const msgs = document.getElementById('chat-messages');
    msgs.innerHTML += `<div class="bg-amber-400 text-emerald-950 p-2 rounded-xl max-w-[85%] ml-auto font-medium">${val}</div>`;
    input.value = '';

    setTimeout(() => {
      msgs.innerHTML += `<div class="bg-[#0f291e] border border-emerald-700/50 text-emerald-100 p-2.5 rounded-xl max-w-[85%]">For fast assistance, reach CEO MD Irfan via Call/WhatsApp at <strong>+91 86689 39991</strong>.</div>`;
      msgs.scrollTop = msgs.scrollHeight;
    }, 400);
  }
</script>
